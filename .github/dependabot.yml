version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
    # Typed ESLint requires TypeScript below 6.1.
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories: [/docker/hyperdx, /packages/api, /packages/app]
    schedule:
      interval: weekly
