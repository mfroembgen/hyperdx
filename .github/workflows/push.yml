name: Push Downstream
on:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  push-downstream:
    if: github.repository == 'hyperdxio/hyperdx'
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        with:
          github-token: ${{ secrets.DOWNSTREAM_TOKEN }}
          script: |
            const { ACTOR, AUTHOR, MESSAGE, SHA } = process.env;
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: '${{ secrets.DOWNSTREAM_OWNER }}',
              repo: '${{ secrets.DOWNSTREAM_REPO_V2 }}',
              workflow_id: '${{ secrets.DOWNSTREAM_WORKFLOW_ID_V2 }}',
              ref: 'main',
              inputs: {
                actor: ACTOR,
                author: AUTHOR,
                message: MESSAGE,
                sha: SHA
              }
            });
