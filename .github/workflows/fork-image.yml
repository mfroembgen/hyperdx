name: Publish fork production image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new immutable version tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fork-production-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mfroembgen/hyperdx
  SOURCE_SHA: ${{ github.sha }}
  VERSION: 2.42.0-fork.2-rc.4

jobs:
  frontend:
    if: github.repository == 'mfroembgen/hyperdx'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Test frontend build checks
        run: node --test scripts/ci/__tests__/verify-frontend-build.test.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build frontend once for both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/hyperdx/Dockerfile
          target: frontend
          outputs: type=local,dest=${{ runner.temp }}/frontend
          cache-from: type=gha,scope=fork-frontend
          cache-to: type=gha,mode=max,scope=fork-frontend
      - name: Archive shared frontend build
        run:
          tar -C "$RUNNER_TEMP/frontend" -czf "$RUNNER_TEMP/frontend.tar.gz" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: ${{ runner.temp }}/frontend.tar.gz
          if-no-files-found: error
          retention-days: 1

  validate:
    if: github.repository == 'mfroembgen/hyperdx'
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: ${{ runner.temp }}
      - name: Extract shared frontend build
        run: |
          mkdir -p "$RUNNER_TEMP/frontend"
          tar -C "$RUNNER_TEMP/frontend" -xzf "$RUNNER_TEMP/frontend.tar.gz"
      - name: Build native production image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/hyperdx/Dockerfile
          target: prod
          platforms: linux/${{ matrix.arch }}
          build-contexts: frontend=${{ runner.temp }}/frontend
          build-args: CODE_VERSION=${{ env.SOURCE_SHA }}
          tags: hyperdx-fork:check
          load: true
          push: false
          cache-from: type=gha,scope=fork-prod-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fork-prod-${{ matrix.arch }}
      - name: Verify shared frontend and native dependencies
        run: |
          docker run --rm --entrypoint bun \
            -v "$RUNNER_TEMP/frontend:/frontend:ro" \
            -v "$PWD/scripts/ci/verify-frontend-build.mjs:/verify.mjs:ro" \
            hyperdx-fork:check /verify.mjs /frontend/dist/standalone/dist /app/packages/app/dist /app
      - name: Verify Bun image and production services
        run: |
          test "$(docker run --rm --entrypoint bun hyperdx-fork:check --version)" = '1.4.4'
          docker network create fork-smoke
          docker run -d --name fork-mongo --network fork-smoke mongo:5.0.32-focal
          docker run -d --name fork-app --network fork-smoke -p 8000:8000 -p 8080:8080 \
            -e MONGO_URI=mongodb://fork-mongo:27017/hyperdx-smoke \
            -e EXPRESS_SESSION_SECRET=fork-ci-session-secret-only \
            -e USAGE_STATS_ENABLED=false hyperdx-fork:check
          mkdir -p "$RUNNER_TEMP/fork-proof"
          docker run --rm --user 0:0 --network host --entrypoint bun \
            -e SMOKE_EXPECTED_REVISION="$SOURCE_SHA" \
            -e SMOKE_EXPECTED_ARCH='${{ matrix.arch }}' \
            -e SMOKE_SESSION_FILE=/proof/session.json \
            -v "$RUNNER_TEMP/fork-proof:/proof" \
            -v "$PWD/scripts/ci/smoke-production.mjs:/smoke.mjs:ro" \
            hyperdx-fork:check /smoke.mjs
          docker restart fork-app
          docker run --rm --user 0:0 --network host --entrypoint bun \
            -e SMOKE_EXPECTED_REVISION="$SOURCE_SHA" \
            -e SMOKE_EXPECTED_ARCH='${{ matrix.arch }}' \
            -e SMOKE_SESSION_FILE=/proof/session.json \
            -e SMOKE_RESUME_SESSION=true \
            -v "$RUNNER_TEMP/fork-proof:/proof" \
            -v "$PWD/scripts/ci/smoke-production.mjs:/smoke.mjs:ro" \
            hyperdx-fork:check /smoke.mjs
      - name: Service logs
        if: failure()
        run: docker logs fork-app
      - name: Stop smoke services
        if: always()
        run: |
          docker rm -f fork-app fork-mongo 2>/dev/null || true
          docker network rm fork-smoke 2>/dev/null || true

  build:
    if:
      github.repository == 'mfroembgen/hyperdx' && github.event_name ==
      'workflow_dispatch' && inputs.publish
    needs: [frontend, validate]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify source and version
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(jq -r .version packages/api/package.json)" = "$VERSION"
          test "$(jq -r .version packages/app/package.json)" = "$VERSION"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: ${{ runner.temp }}
      - name: Extract shared frontend build
        run: |
          mkdir -p "$RUNNER_TEMP/frontend"
          tar -C "$RUNNER_TEMP/frontend" -xzf "$RUNNER_TEMP/frontend.tar.gz"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push native image by digest
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/hyperdx/Dockerfile
          target: prod
          platforms: linux/${{ matrix.arch }}
          build-contexts: frontend=${{ runner.temp }}/frontend
          build-args: CODE_VERSION=${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/mfroembgen/hyperdx
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
          outputs:
            type=image,name=${{ env.IMAGE
            }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: true
          cache-from: type=gha,scope=fork-prod-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fork-prod-${{ matrix.arch }}
      - name: Verify published image frontend and native dependencies
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker run --rm --entrypoint bun \
            -v "$RUNNER_TEMP/frontend:/frontend:ro" \
            -v "$PWD/scripts/ci/verify-frontend-build.mjs:/verify.mjs:ro" \
            "$IMAGE@$DIGEST" /verify.mjs /frontend/dist/standalone/dist /app/packages/app/dist /app
      - name: Export digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if:
      github.repository == 'mfroembgen/hyperdx' && github.event_name ==
      'workflow_dispatch' && inputs.publish
    needs: build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >"$RUNNER_TEMP/tag-check.log" 2>&1; then
            echo "Refusing to overwrite existing $IMAGE:$VERSION" >&2
            exit 1
          fi
          error=$(cat "$RUNNER_TEMP/tag-check.log")
          case "$error" in
            *'manifest unknown'*|*'not found'*|*'404 Not Found'*) ;;
            *) printf '%s\n' "$error" >&2; exit 1 ;;
          esac
          refs=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            refs+=("$IMAGE@sha256:$digest")
          done
          test "${#refs[@]}" -eq 2
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
