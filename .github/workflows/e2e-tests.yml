name: E2E Tests
on:
  workflow_call:

jobs:
  e2e-tests:
    name: E2E Tests - Shard ${{ matrix.shard }}
    # 8-core runner so the 4 Playwright workers (see playwright.config.ts) have
    # CPU headroom alongside the app + ClickHouse + MongoDB — 4 workers
    # over-subscribed the 4-vCPU ubuntu-24.04 runner and caused timeouts.
    # Hosted fork runners have 4 vCPUs, so they run 2 workers with a longer
    # timeout.
    runs-on:
      ${{ github.repository == 'hyperdxio/hyperdx' && '8-core-playwright' ||
      'ubuntu-24.04' }}
    timeout-minutes: ${{ github.repository == 'hyperdxio/hyperdx' && 15 || 25 }}
    permissions:
      contents: read
    env:
      # Hosted fork runners need CPU headroom for the app and databases.
      E2E_WORKERS: ${{ github.repository == 'hyperdxio/hyperdx' && '4' || '2' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: E2E setup
        uses: ./.github/actions/e2e-setup

      - name: Run Playwright tests (full-stack mode)
        env:
          # Unset falls back to the default in playwright.config.ts.
          E2E_WORKERS:
            ${{ github.event.pull_request.head.repo.fork && '2' ||
            vars.E2E_WORKERS }}
        run: |
          cd packages/app
          bun --no-env-file scripts/run-e2e.js --shard=${{ matrix.shard }}/4

      - name: E2E teardown
        if: always()
        uses: ./.github/actions/e2e-teardown
        with:
          artifact-suffix: ${{ matrix.shard }}
