name: Vulnerability Alerts

on:
  schedule:
    - cron: '0 9 * * *' # Daily at 9am UTC
  workflow_dispatch:

jobs:
  alert:
    if: github.repository == 'hyperdxio/hyperdx'
    runs-on: ubuntu-latest
    steps:
      - uses: kunalnagarco/action-cve@3efd8136c5417629168f6282d51a8295d2e0e54e # v1.17.5
        with:
          org: hyperdxio
          token: ${{ secrets.DEPENDABOT_NOTIF_PAT }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK_VULNERABILITIES }}
          severity: medium,high,critical
