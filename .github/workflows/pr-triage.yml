name: PR Triage

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description:
          PR number to classify (leave blank to classify all open PRs)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id
    }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'hyperdxio/hyperdx'
    name: Test triage logic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: bun test ./.github/scripts/__tests__/pr-triage-classify.test.js

  classify:
    name: Classify PR risk tier
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    # For pull_request events skip drafts; workflow_dispatch always runs
    if: >-
      github.repository == 'hyperdxio/hyperdx' && (github.event_name ==
      'workflow_dispatch' || !github.event.pull_request.draft)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Classify and label PR(s)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const run = require(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/pr-triage.js'));
            await run({ github, context });
