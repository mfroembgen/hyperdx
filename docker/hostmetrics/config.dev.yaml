receivers:
  mongodb:
    hosts:
      - endpoint: db:27017
    collection_interval: 5s
    initial_delay: 1s
    tls:
      insecure: true
      insecure_skip_verify: true
  hostmetrics:
    collection_interval: 5s
    scrapers:
      cpu:
      load:
      memory:
      disk:
      filesystem:
      network:
exporters:
  debug:
    verbosity: normal
  otlphttp:
    endpoint: 'http://otel-collector:4318'
    headers:
      authorization: ${env:HYPERDX_API_KEY}
    compression: gzip
service:
  telemetry:
    logs:
      level: ${env:HYPERDX_LOG_LEVEL}
  pipelines:
    metrics:
      receivers: [mongodb, hostmetrics]
      exporters: [otlphttp, debug]
